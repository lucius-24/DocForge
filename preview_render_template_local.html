<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    $if(mathjax)$
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["\\[", "\\]"]]
        }
      };
    </script>
    <script defer src="$mathjax$"></script>
    $endif$
    $if(highlighting-css)$
    <style>
    $highlighting-css$
    </style>
    $endif$
    <style>
      html, body { margin: 0; min-height: 100%; }
      body {
        background: #1e1e1e;
        color: #dbeafe;
        font-family: "Microsoft YaHei", "微软雅黑", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.75;
        padding: 16px;
        box-sizing: border-box;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #1a1a1a; }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, rgba(0,229,255,.35), rgba(124,58,237,.35));
        border-radius: 999px;
        border: 2px solid #1a1a1a;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, rgba(0,229,255,.55), rgba(124,58,237,.55));
      }
      a { color: rgba(0, 229, 255, 0.95); text-decoration: none; }
      p { color: #dbeafe; }
      h1, h2, h3, h4, h5 {
        color: #ffffff;
        border-bottom: 1px solid rgba(148, 163, 184, 0.16);
        padding-bottom: 6px;
        margin-top: 20px;
      }
      code {
        background-color: #151515;
        border: 1px solid rgba(148, 163, 184, 0.18);
        padding: 2px 6px;
        border-radius: 8px;
        font-family: Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 0.92em;
      }
      pre {
        background: #151515;
        border: 1px solid rgba(148, 163, 184, 0.18);
        padding: 14px;
        border-radius: 12px;
        overflow-x: auto;
        box-shadow: 0 0 0 1px rgba(0,229,255,.08), 0 0 18px rgba(0,229,255,.05);
      }
      pre code { background: transparent; border: 0; padding: 0; }
      pre code *,
      pre.sourceCode *,
      pre.sourceCode > code > span,
      pre.sourceCode > code > span > a.sourceLine,
      pre.sourceCode a.sourceLine,
      pre.sourceCode span.sourceLine,
      .sourceCode > span,
      .sourceLine,
      a.sourceLine {
        background: transparent !important;
        border: 0 !important;
        box-shadow: none !important;
      }
      pre.sourceCode span,
      pre.sourceCode a,
      pre.sourceCode span *,
      pre.sourceCode a * {
        background-color: transparent !important;
      }
      blockquote {
        border-left: 4px solid rgba(0, 229, 255, 0.7);
        margin: 10px 0;
        padding: 10px 12px;
        color: #93c5fd;
        background: rgba(15, 26, 51, 0.35);
        border-radius: 0 10px 10px 0;
      }
      table { border-collapse: collapse; width: 100%; margin-top: 14px; }
      th, td { border: 1px solid rgba(148, 163, 184, 0.28) !important; padding: 8px 12px; }
      th { background: rgba(15, 26, 51, 0.55); font-weight: 700; }
      ul, ol { padding-left: 22px; }
      img { max-width: 100%; border-radius: 12px; border: 1px solid rgba(148, 163, 184, 0.16); }
      .math { color: #dbeafe; }
    </style>
  </head>
  <body>
    $body$
  </body>
</html>
